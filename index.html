<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>SunriseCare CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: clinic workstation — fixed navy rail (modules = DFD processes 1.0–8.0) + branch-aware top bar + working canvas; collapses to a top tab strip on phones */
:root{
  --ink:#24504b; --ink-2:#2f625c; --bg:#f6f5f0; --surface:#ffffff; --surface-2:#faf9f5; --line:#e7e3d8; --muted:#6c7069; --fg:#22302d;
  --sun:#ec7a4f; --sun-soft:#fdece3; --sun-ink:#a4471f;
  --ok:#2f8f63; --ok-soft:#e3f3ea; --warn:#b07a1c; --warn-soft:#fbf1dc; --bad:#c4453b; --bad-soft:#fbe7e4; --info:#3a73a8; --info-soft:#e6eff8;
  --teal:#3c8a80; --rail-fg:#d7e8e4; --rail-active:#ffffff; --rail-muted:#9fc2bb; --rail-line:#3d736c;
  --shadow:0 1px 2px rgba(60,50,30,.05),0 6px 18px -10px rgba(60,50,30,.18);
  --display:"Nunito","Segoe UI",system-ui,sans-serif; --body:"Nunito Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#14302d; --ink-2:#1d403c; --bg:#131c1b; --surface:#1b2725; --surface-2:#1f2d2b; --line:#2e3f3c; --muted:#a3b2ae; --fg:#e8efed;
  --sun:#f39470; --sun-soft:#3b261c; --sun-ink:#ffc6ad; --ok:#5cc890; --ok-soft:#173329; --warn:#e3b45a; --warn-soft:#352a12; --bad:#f07a70; --bad-soft:#3b1f1d; --info:#86b3e3; --info-soft:#1b2d42;
  --teal:#6cc0b4; --rail-muted:#86a9a2; --rail-line:#2f5752; --shadow:0 1px 2px rgba(0,0,0,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#14302d; --ink-2:#1d403c; --bg:#131c1b; --surface:#1b2725; --surface-2:#1f2d2b; --line:#2e3f3c; --muted:#a3b2ae; --fg:#e8efed;
  --sun:#f39470; --sun-soft:#3b261c; --sun-ink:#ffc6ad; --ok:#5cc890; --ok-soft:#173329; --warn:#e3b45a; --warn-soft:#352a12; --bad:#f07a70; --bad-soft:#3b1f1d; --info:#86b3e3; --info-soft:#1b2d42;
  --teal:#6cc0b4; --rail-muted:#86a9a2; --rail-line:#2f5752; --shadow:0 1px 2px rgba(0,0,0,.2); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:linear-gradient(to right,var(--ink) 232px,var(--bg) 232px)}
#root{min-height:100vh}
.rail{background:var(--ink);color:var(--rail-fg);display:flex;flex-direction:column;gap:18px;padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px}
.brand svg{flex:none}
.brand b{font:800 17px/1.1 var(--display);color:#fff;letter-spacing:-.2px}
.brand small{display:block;font:600 11px var(--body);color:var(--rail-muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);margin:12px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--rail-fg);text-decoration:none;font-weight:500}
.nav a .pn{font:500 10.5px var(--mono);color:var(--rail-muted);width:26px}
.nav a:hover{background:var(--ink-2);color:#fff}
.nav a.on{background:var(--sun);color:#fff}
.nav a.on .pn{color:#ffe1cc}
.nav a[hidden]{display:none}
.rail .who{margin-top:auto;background:var(--ink-2);border-radius:16px;padding:10px 12px;font-size:13px}
.rail .who label{font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--rail-muted)}
.rail .who select{width:100%;margin-top:6px;background:var(--ink);border:1px solid var(--rail-line);border-radius:10px;padding:6px 8px;color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:14px;align-items:center;padding-block:12px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.top .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted)}
.top .search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;background:var(--surface);white-space:nowrap}
.chip select{border:0;background:transparent;font-weight:600;outline:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.canvas{padding-block:22px 40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hd h1{font:800 24px/1.15 var(--display);margin:0;letter-spacing:-.3px;text-wrap:balance}
.hd p{margin:4px 0 0;color:var(--muted)}
.crumb{font:500 11.5px var(--mono);color:var(--sun-ink);letter-spacing:.04em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.card h2{font:700 15.5px var(--display);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font:500 12px var(--body);color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font:800 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px}
.up{color:var(--ok)}.dn{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.num{text-align:right}
.mono{font-family:var(--mono);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}.p-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}.p-sun{background:var(--sun-soft);color:var(--sun-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--sun);border-color:var(--sun);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-weight:600;font-size:13px}
.f label .req{color:var(--bad)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 11px;min-width:0;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--sun);outline:0;box-shadow:0 0 0 3px var(--sun-soft)}
.f .hint{font-size:12px;color:var(--muted)}
.f.err input{border-color:var(--bad)} .f .emsg{font-size:12px;color:var(--bad)}
fieldset{border:0;padding:0;margin:0;display:contents}
.legend{grid-column:1/-1;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--sun-ink);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:6px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 14px;font-size:13.5px}
.alert b{display:block}
.a-bad{background:var(--bad-soft);color:var(--bad)}.a-warn{background:var(--warn-soft);color:var(--warn)}.a-ok{background:var(--ok-soft);color:var(--ok)}.a-info{background:var(--info-soft);color:var(--info)}
.alert span{color:var(--fg)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sun-soft);color:var(--sun-ink);display:grid;place-items:center;font:700 13px var(--display);flex:none}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:grid;grid-template-columns:86px 14px 1fr;gap:10px;padding-bottom:12px}
.tl .it .when{font:500 12px var(--mono);color:var(--muted);text-align:right}
.tl .it .bar{position:relative}
.tl .it .bar:before{content:"";position:absolute;left:6px;top:4px;bottom:-12px;width:2px;background:var(--line)}
.tl .it .bar:after{content:"";position:absolute;left:2px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--sun)}
.tl .it:last-child .bar:before{display:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center;font:500 13px var(--mono);background:var(--surface);cursor:pointer}
.slot.full{background:var(--surface-2);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.slot.sel{background:var(--sun);border-color:var(--sun);color:#fff}
.sched{display:grid;grid-template-columns:64px repeat(4,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:600px}
.sched>div{background:var(--surface);padding:6px 8px;font-size:12.5px;min-height:42px}
.sched .h{background:var(--surface-2);font-weight:600}
.sched .t{font:500 12px var(--mono);color:var(--muted);background:var(--surface-2)}
.appt{border-radius:10px;padding:4px 7px;border-left:3px solid var(--info);background:var(--info-soft);line-height:1.3}
.appt.w{border-left-color:var(--sun);background:var(--sun-soft)}
.appt.d{border-left-color:var(--ok);background:var(--ok-soft)}
.appt small{display:block;color:var(--muted)}
.queue{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:8px 12px}
.q .no{font:700 18px var(--mono);color:var(--sun-ink)}
.bars{display:flex;flex-direction:column;gap:9px}
.bars .b{display:grid;grid-template-columns:140px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.bars .track{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bars .fill{height:100%;background:var(--sun);border-radius:999px}
.bars .fill.alt{background:var(--teal)}
.matrix td.cell{text-align:center;font:500 13px var(--mono)}
.cell.low{background:var(--bad-soft);color:var(--bad);font-weight:700}
.cell.exp{background:var(--warn-soft);color:var(--warn);font-weight:700}
.cell.hi{background:var(--info-soft);color:var(--info)}
.phone{width:min(360px,100%);border:10px solid var(--ink);border-radius:36px;background:var(--surface);overflow:hidden;box-shadow:0 18px 40px -20px rgba(40,50,40,.45);margin-inline:auto}
.phone .scr{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:640px}
.phone .ph{display:flex;justify-content:space-between;font:600 12px var(--mono);color:var(--muted)}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--sun)}
.opt{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;background:var(--surface)}
.opt.on{border-color:var(--sun);background:var(--sun-soft)}
.qr{width:120px;height:120px;margin:4px auto;display:block}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:20}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login .art{background:var(--ink);color:#fff;padding:48px max(40px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:30px;position:relative;overflow:hidden}
.login .art:after{content:"";position:absolute;right:-150px;bottom:-190px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,var(--sun) 0 38%,rgba(236,122,79,.35) 39% 58%,rgba(236,122,79,.12) 59% 100%);pointer-events:none}
.login .art>*{position:relative;z-index:1}
.login .art h2{font:800 34px/1.12 var(--display);margin:0;max-width:16ch;letter-spacing:-.6px;text-wrap:balance}
.login .art p{color:var(--rail-fg);max-width:46ch}
.login .pane{display:grid;place-items:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface)}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px;font-weight:600;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{text-align:center;font:600 18px var(--mono);padding:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.rx{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1fr) 54px 118px 28px;gap:8px;align-items:center}
.rx.h{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rx input,.rx select{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface);min-width:0;width:100%}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;font-size:13px}
.paper .ph2{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid var(--fg);padding-bottom:8px;margin-bottom:10px}
.ttl{font:800 16px var(--display)}
.foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:6px;color:var(--muted);font-size:11.5px}
.note{font-size:12.5px;color:var(--muted)}
.hide-sm{}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-73,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
 .app{grid-template-columns:1fr;background:var(--bg)}
 .rail{position:static;height:auto;flex-direction:column;gap:10px;padding-right:max(14px,env(safe-area-inset-right,0px))}
 .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}.nav .grp{display:none}.nav a{white-space:nowrap}
 .rail .who{margin-top:0}
 .g2,.form{grid-template-columns:minmax(0,1fr)}
 .login{grid-template-columns:1fr}.login .art{padding:28px 16px}
 .bars .b{grid-template-columns:100px 1fr 70px}
 .rx{grid-template-columns:1fr 1fr}.rx.h{display:none}
 .hide-sm{display:none}
 .canvas,.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" hidden></div>
<script>
const BR={ALL:"All 5 branches",PJ1:"PJ SS2 (HQ)",PJ2:"PJ Damansara Utama",SA1:"Shah Alam Sek. 7",SA2:"Shah Alam Setia Alam",SJ1:"Subang Jaya SS15"};
const ROLES={
 rec:{n:"Aina Sofea · Receptionist",views:["today","register","appointments","billing","claims"]},
 nurse:{n:"Siti Hajar · Staff Nurse",views:["today","appointments","consult"]},
 doc:{n:"Dr. Mei Ling Chong · GP",views:["today","consult","appointments","patient"]},
 pha:{n:"Ravi Kumar · Pharmacy Asst.",views:["pharmacy","inventory"]},
 mgt:{n:"Dr. Hafiz Rahman · Director",views:["today","reports","inventory","claims","patient"]}};
const NAV=[["Front desk",[["today","Today","—"],["register","Register patient","1.0"],["patient","Patient record","1.0"],["appointments","Appointments & queue","2.0"]]],
 ["Clinical",[["consult","Consultation","3.0"],["pharmacy","Dispensing","4.0"],["inventory","Medicine stock","5.0"]]],
 ["Finance",[["billing","Billing & e-invoice","6.0"],["claims","Panel claims","7.0"]]],
 ["Management",[["reports","Reports & KPIs","8.0"]]],
 ["Patient app",[["portal","Patient portal (mobile)","2.0"]]]];
let S={view:"login",role:"rec",branch:"PJ1",loginRole:"Staff",slot:"10:30",pstep:2,rx:[["Paracetamol 500 mg tablet","1 tab","QID PRN",3,12],["Cetirizine 10 mg tablet","1 tab","ON",5,5]],dispensed:{},paid:false,claimsSel:{},xfer:false,repBranch:"ALL"};
const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600)}
function go(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0)}
const logo=`<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#ec7a4f"/><circle cx="17" cy="21" r="7" fill="#fff"/><rect x="4" y="21" width="26" height="9" fill="#ec7a4f"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M17 8v3M8.5 12l2 2M25.5 12l-2 2M5 20h3M26 20h3"/></g><rect x="5" y="23" width="24" height="2.2" rx="1.1" fill="#fff"/></svg>`;
function pill(t,k){return `<span class="pill p-${k}">${t}</span>`}
function shell(inner){
 const allowed=ROLES[S.role].views;
 const nav=NAV.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([v,l,p])=>{const ok=v==="portal"||allowed.includes(v);return `<a href="#${v}" data-go="${v}" class="${S.view===v?"on":""}" ${ok?"":"hidden"}><span class="pn">${p}</span>${l}</a>`}).join("")).join("");
 return `<div class="app"><aside class="rail"><div class="brand">${logo}<div><b>SunriseCare</b><small>Sunrise Family Clinics</small></div></div>
 <nav class="nav" aria-label="Modules">${nav}</nav>

/* ---------- PATIENT PORTAL (mobile) ---------- */
function qr(){let s='';const n=21;let seed=11;const fp=(x,y,ox,oy)=>{const dx=x-ox,dy=y-oy;if(dx<0||dy<0||dx>6||dy>6)return null;return (dx===0||dy===0||dx===6||dy===6)||(dx>=2&&dx<=4&&dy>=2&&dy<=4)};
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){let v=fp(x,y,0,0);if(v===null)v=fp(x,y,14,0);if(v===null)v=fp(x,y,0,14);if(v===null){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))v=false;else{seed=(seed*9301+49297)%233280;v=seed/233280>.5}}if(v)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg class="qr" viewBox="-1 -1 23 23" aria-label="Check-in QR code"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/><g fill="#24504b">${s}</g></svg>`}

 else if(st===2) body=`<div class="crumb">Step 2 of 3 · PJ SS2 (HQ)</div><b style="font:800 20px var(--display)">Pick a time</b><div class="row">${["Mon 26","Tue 27","Wed 28"].map((d,i)=>`<span class="chip" style="${i===0?"background:var(--ink);color:#fff;border-color:var(--ink)":""}">${d}</span>`).join("")}</div>
 <div class="f"><label for="pd">Doctor</label><select id="pd"><option>Any GP (shortest wait)</option><option>Dr. Mei Ling Chong</option></select></div>
 <div class="slots">${["10:30","10:45","11:00","11:15","11:30","14:00"].map((t,i)=>`<button type="button" class="slot ${i===2||i===4?"full":""} ${S.slot===t?"sel":""}" data-slot="${t}" ${i===2||i===4?"disabled":""}>${t}</button>`).join("")}</div>

 else body=`<div class="alert a-ok"><div><b>Booking confirmed</b><span>Appointment A016 · Mon 26 Apr, ${S.slot} · PJ SS2 (HQ)</span></div></div>${qr()}<p class="note" style="text-align:center;margin:0">Show this code at the counter or kiosk to check in.</p><dl class="kv"><dt>Doctor</dt><dd>Any GP</dd><dt>Reminders</dt><dd>WhatsApp 24 h and 2 h before</dd><dt>Payer</dt><dd>MediPanel TPA</dd></dl><button class="btn">Add to calendar</button><button class="btn" data-ps="2">Reschedule</button>`;
 return hd("Process 2.0 · Patient self-service","Patient portal","Mobile view used by patients to book, check in and download receipts and MCs.",`<button class="btn" data-ps="1">Restart demo</button>`)+
 `<div class="grid g2"><div class="phone"><div class="scr"><div class="ph"><span>9:41</span><span>SunriseCare</span><span>●●●</span></div><div class="steps">${[1,2,3].map(i=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div>${body}</div></div>

document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-lr],[data-slot],[data-ps],[data-rm],[data-disp],#addRx,#payBtn,#xferBtn,#subClaims,#logout,#saveReg,#checkin,#callNext,#finishC,#poBtn,.opt");if(!t)return;
 if(t.dataset.go){e.preventDefault();go(t.dataset.go)}
 else if(t.dataset.lr){S.loginRole=t.dataset.lr;render()}
 else if(t.dataset.slot){S.slot=t.dataset.slot;render()}
 else if(t.dataset.ps){S.pstep=+t.dataset.ps;render();if(S.pstep===3)toast("Booked. Confirmation sent by WhatsApp.")}
 else if(t.dataset.rm){S.rx.splice(+t.dataset.rm,1);render()}
 else if(t.dataset.disp){S.dispensed[t.dataset.disp]=1;render();toast("Dispensed. Stock updated and label printed.")}
 else if(t.id==="addRx"){const m=$("#addMed").value;if(/Amoxicillin/.test(m)){$("#rxMsg").innerHTML=`<div class="alert a-bad" style="margin-top:10px"><div><b>Blocked: Amoxicillin is a penicillin</b><span>Patient has a recorded penicillin allergy. Choose an alternative such as Azithromycin.</span></div></div>`;return}S.rx.push([m,"1 tab","OD",5,5]);render()}

 else if(t.id==="xferBtn"){S.xfer=true;render();toast("Transfer request sent to SJ1 and head office.")}
 else if(t.id==="subClaims"){const n=Object.values(S.claimsSel).filter(Boolean).length;toast(n?n+" claim(s) submitted to panel portals.":"Select at least one claim marked Ready.")}
 else if(t.id==="logout"){go("login")}
 else if(t.id==="saveReg"){const ic=$("#ic").value.trim();const f=$("#f-ic");f.classList.remove("err");f.querySelector(".emsg")?.remove();if(!/^\d{6}-\d{2}-\d{4}$/.test(ic)&&!/^[A-Z]\d{7,8}$/.test(ic)){f.classList.add("err");f.insertAdjacentHTML("beforeend",`<span class="emsg">Enter a MyKad number as YYMMDD-PB-#### or a passport number such as A12345678.</span>`);return}toast("Saved. Patient ID SFC-018403 created; portal login sent by SMS.")}
 else if(t.id==="checkin"){toast("Queue number W023 issued. Estimated wait 22 min.")}
 else if(t.id==="callNext"){toast("Calling A014 Tan Wei Ming to Room 1.")}
 else if(t.id==="finishC"){toast("Consultation saved. Prescription sent to pharmacy; MC sent to patient portal.")}
 else if(t.id==="poBtn"){toast("Draft PO created for 4 items below reorder level.")}
 else if(t.classList.contains("opt")){t.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.remove("on"));t.classList.add("on")}});

document.addEventListener("input",e=>{if(e.target.id==="ic"){const v=e.target.value.trim();const box=$("#dupBox");if(!box)return;if(v.startsWith("880412-14-5523")){box.className="alert a-warn";box.innerHTML=`<div><b>Possible duplicate: Tan Wei Ming (SFC-004217)</b><span>Registered at PJ SS2 in 2021, last visit Subang Jaya on 14 Apr 2027. Open the existing record instead of creating a new one.</span></div>`}else{box.className="alert a-ok";box.innerHTML=`<div><b>No existing record found</b><span>Searched 18,402 patients in all 5 branches by IC number and name.</span></div>`}
 const m=v.match(/^(\d{2})(\d{2})(\d{2})-\d{2}-\d{3}(\d)$/);if(m){const yy=+m[1];$("#dob").value=`${m[3]}/${m[2]}/${yy>30?19:20}${m[1]}`;$("#gd").value=(+m[4])%2?"Male":"Female"}}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="loginF"){S.view=S.loginRole==="Patient"?"portal":S.loginRole==="Head office"?"reports":"today";if(S.loginRole==="Head office"){S.role="mgt";S.branch="ALL"}render()}if(e.target.id==="bookF")toast("Booked "+S.slot+". WhatsApp confirmation sent.")});
(function(){const h=(location.hash||"").slice(1);if(VIEWS[h])S.view=h;if(h==="reports"||h==="inventory"){S.role="mgt";S.branch="ALL"}if(h==="pharmacy")S.role="pha";if(h==="consult"||h==="patient")S.role="doc";render()})();
